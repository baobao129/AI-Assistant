name: enterprise-agent
services:
  mysql:
    image: mysql:8.4.8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Generate .env first}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-enterprise_agent}
      MYSQL_USER: ${MYSQL_USER:-agent_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Generate .env first}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - 127.0.0.1:${MYSQL_HOST_PORT:-13306}:3306
    healthcheck:
      test:
        [
          CMD-SHELL,
          'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE" --execute="SELECT 1" >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Generate .env first}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Generate .env first}
    command: minio server /minio_data --console-address :9001
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.25
    command: [milvus, run, standalone]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?Generate .env first}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?Generate .env first}
      MQ_TYPE: woodpecker
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - 127.0.0.1:${MILVUS_HOST_PORT:-19530}:19530
    depends_on:
      etcd: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:9091/healthz]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-enterprise_agent}
      MYSQL_USER: ${MYSQL_USER:-agent_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Generate .env first}
      MYSQL_READONLY_USER: ${MYSQL_READONLY_USER:-agent_readonly}
      MYSQL_READONLY_PASSWORD: ${MYSQL_READONLY_PASSWORD:?Generate .env first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Generate .env first}
      MILVUS_URI: http://milvus:19530
      # 部署默认持久化档位（ADR-035）：Checkpoint 落在卷内，重启后仍可恢复；
      # 如需内存档位（不跨重启）在 .env 显式设 CHECKPOINT_MODE=memory
      CHECKPOINT_MODE: ${CHECKPOINT_MODE:-sqlite}
      CHECKPOINT_SQLITE_PATH: /app/runtime/checkpoints.sqlite
      MAX_TOOL_ITERATIONS: ${MAX_TOOL_ITERATIONS:-8}
      MAX_REPAIR_ATTEMPTS: ${MAX_REPAIR_ATTEMPTS:-3}
      MAX_ANSWER_REVISIONS: ${MAX_ANSWER_REVISIONS:-1}
      LLM_PROVIDER: ${LLM_PROVIDER:-remote}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      SQL_AGENT_PROVIDER: ${SQL_AGENT_PROVIDER:-auto}
      LOCAL_LLM_STREAMING: ${LOCAL_LLM_STREAMING:-false}
      LOCAL_LLM_STRUCTURED_OUTPUT: ${LOCAL_LLM_STRUCTURED_OUTPUT:-false}
      LOCAL_LLM_TOOL_CALLING: ${LOCAL_LLM_TOOL_CALLING:-false}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-siliconflow}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-30}
      RERANK_TOP_N: ${RERANK_TOP_N:-20}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid_rerank}
      RERANK_MAX_DOCUMENT_CHARS: ${RERANK_MAX_DOCUMENT_CHARS:-4096}
      RERANK_MAX_TOTAL_CHARS: ${RERANK_MAX_TOTAL_CHARS:-80000}
      PARSER_PROVIDER: ${PARSER_PROVIDER:-lightweight}
      # mineru.net v4 云解析：基地址 + Token + 模型版本（PARSER_PROVIDER=mineru 时生效）
      MINERU_BASE_URL: ${MINERU_BASE_URL:-https://mineru.net/api/v4}
      MINERU_API_KEY: ${MINERU_API_KEY:-}
      MINERU_MODEL_VERSION: ${MINERU_MODEL_VERSION:-pipeline}
      PARSER_TIMEOUT_SECONDS: ${PARSER_TIMEOUT_SECONDS:-600}
      # 本地接受上限（默认 1 GiB）与远端 MinerU 单份硬限（200,000,000 字节且 200 页）是两个独立的数
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-1073741824}
      MINERU_MAX_BYTES: ${MINERU_MAX_BYTES:-200000000}
      MINERU_MAX_PAGES: ${MINERU_MAX_PAGES:-200}
      MIN_STORAGE_FREE_BYTES: ${MIN_STORAGE_FREE_BYTES:-268435456}
      MAX_EXTRACTED_CHARS: ${MAX_EXTRACTED_CHARS:-4000000}
      # LangSmith 追踪：默认关闭，避免企业数据外发；如需开启在 .env 设 LANGSMITH_TRACING=true
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      SQL_MAX_ROWS: ${SQL_MAX_ROWS:-100}
      SQL_QUERY_TIMEOUT_SECONDS: ${SQL_QUERY_TIMEOUT_SECONDS:-10}
      DATA_SOURCE_ID: ${DATA_SOURCE_ID:-demo_sales}
      ALLOWED_TABLES: ${ALLOWED_TABLES:-sales_orders,procurement_orders,products}
      MASKED_COLUMNS: ${MASKED_COLUMNS:-customer_contact,contact_phone,contact_email}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-43200}
      AUTH_BOOTSTRAP_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-demo}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:?Generate .env first}
      APPROVAL_EXPIRY_SECONDS: ${APPROVAL_EXPIRY_SECONDS:-1800}
      # Run 执行租约与有界崩溃恢复（见 .env.example 与 docs/OPERATIONS_RUNBOOK.md）
      RUN_STALE_RUNNING_SECONDS: ${RUN_STALE_RUNNING_SECONDS:-900}
      RUN_MAX_RECOVERY_ATTEMPTS: ${RUN_MAX_RECOVERY_ATTEMPTS:-2}
      RUN_HEARTBEAT_SECONDS: ${RUN_HEARTBEAT_SECONDS:-30}
      # 原文件受控存储与 pending 摄取 Job 补调度（默认位于持久卷 /app/runtime 之下）
      UPLOAD_ROOT: ${UPLOAD_ROOT:-runtime/uploads}
      INGESTION_PENDING_SCHEDULE_SECONDS: ${INGESTION_PENDING_SCHEDULE_SECONDS:-15}
      INGESTION_SCHEDULE_BATCH: ${INGESTION_SCHEDULE_BATCH:-10}
      # 摄取执行期独立心跳（执行租约续租）周期秒数（ADR-035）
      INGESTION_HEARTBEAT_SECONDS: ${INGESTION_HEARTBEAT_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - checkpoint_data:/app/runtime
    ports:
      - 127.0.0.1:${BACKEND_PORT:-8000}:8000
    depends_on:
      mysql: { condition: service_healthy }
      milvus: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=10)",
        ]
      interval: 15s
      timeout: 12s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: frontend
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-5173}:8080
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
  checkpoint_data:
