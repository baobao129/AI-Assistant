server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
