server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Proxy limit must stay above the backend's local MAX_DOCUMENT_BYTES (default 1 GiB);
    # multipart framing needs a little headroom, so keep this pair in sync when either moves.
    client_max_body_size 1100m;
    # Large uploads and long parsing waits must not be cut by the proxy.
    proxy_request_buffering on;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
