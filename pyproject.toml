[project]
name = "enterprise-multi-source-agent"
version = "0.1.0"
description = "Contract-preserving Phase 0/1 infrastructure and graph skeleton"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "langgraph==1.2.13",
  "langchain-core==1.6.6",
  "langgraph-checkpoint-sqlite==3.1.1",
  "pymilvus==2.6.17",
  "PyMySQL[rsa]==1.2.3",
  "httpx==0.28.1",
  "sqlglot==27.9.0",
  "python-multipart==0.0.20",
  "pypdf>=6.19.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["smoke: small live runtime acceptance checks"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI expresses dependency injection as a call in an argument default.
"backend/api/routers/*.py" = ["B008"]
"backend/api/main.py" = ["B008"]
